name: Compilar y Publicar App Swing Java 26

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que GitHub Actions pueda crear el Tag y la Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obligatorio para que Git seiente el historial y permita crear tags

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Compile Java Code
        run: |
          mkdir -p out/production
          find src -name "*.java" > sources.txt
          javac -d out/production -cp "libs/*:src" @sources.txt

      - name: Package Executable JAR
        run: |
          jar cfe app.jar Main -C out/production .

      # --- PASO NUEVO: Crear y subir el Tag automáticamente ---
      - name: Generar y empujar Tag automático
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Generamos un nombre de tag basado en la fecha y hora UTC (ej: v1.0.1711234567)
          TAG_NAME="v1.0.$(date +%s)"
          
          echo "Creando tag $TAG_NAME..."
          git tag $TAG_NAME
          git push origin $TAG_NAME
          
          # Guardamos el nombre del tag para usarlo en el siguiente paso de la Release
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      # --- PASO DE RELEASE ---
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app.jar
          tag_name: ${{ env.TAG_NAME || github.ref_name }}
          name: Release ${{ env.TAG_NAME || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

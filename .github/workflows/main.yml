name: Compilar y Publicar App Swing Java 26

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Compile Java Code
        run: |
          mkdir -p out/production
          find src -name "*.java" > sources.txt
          javac -d out/production -cp "libs/*:src" @sources.txt

      - name: Package Executable JAR
        run: |
          jar cfe app.jar Main -C out/production .

      # (Opcional pero recomendado) Comprueba que el JAR existe antes de subirlo
      - name: Verify JAR exists
        run: ls -la app.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app.jar
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
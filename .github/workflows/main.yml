name: Compilar App Swing Java 26

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio completo (incluida la carpeta libs/)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java 26
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'

      # 3. Compilar el código enlazando la carpeta libs/
      - name: Compile Java Code
        run: |
          mkdir -p out/production
          find src -name "*.java" > sources.txt
          javac -d out/production -cp "libs/*:src" @sources.txt

      # 4. Generar el archivo JAR ejecutable de tu aplicación
      - name: Package Executable JAR
        run: |
          # Genera el 'app.jar' indicando que 'Main' es el punto de entrada
          jar cfe app.jar Main -C out/production .

      # 5. Subir el archivo compilado como artefacto de GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-java26
          path: app.jar

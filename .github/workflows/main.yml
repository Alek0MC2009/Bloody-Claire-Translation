name: Compilar y Publicar App Swing Java 26

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' # Se activa automáticamente cuando subes un tag como v1.0.0, v2.1.0, etc.
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que GitHub Actions pueda crear la Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Compile Java Code
        run: |
          mkdir -p out/production
          find src -name "*.java" > sources.txt
          javac -d out/production -cp "libs/*:src" @sources.txt

      - name: Package Executable JAR
        run: |
          jar cfe app.jar Main -C out/production .

      # Este paso crea la Release y sube el JAR SOLO cuando subes un Tag (etiqueta de versión)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app.jar
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

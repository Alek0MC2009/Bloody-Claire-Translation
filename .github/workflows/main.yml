name: Compilar y Publicar App Swing Java 26

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Compile Java Code
        run: |
          mkdir -p out/production
          find src -name "*.java" > sources.txt
          javac -d out/production -cp "libs/*:src" @sources.txt

      - name: Package Executable JAR (Fat JAR)
        run: |
          # 1. Extraer los archivos .class de Gson directamente en out/production
          unzip -q libs/gson-2.14.0.jar -d out/production
          
          # 2. Eliminar la firma de la librería si la tuviera (evita SecurityException)
          rm -rf out/production/META-INF/*.SF out/production/META-INF/*.DSA out/production/META-INF/*.RSA
          
          # 3. Crear el JAR empaquetando todo junto (Clases propias + Gson)
          jar cfe app.jar Main -C out/production .

      - name: Verify JAR generated
        run: ls -la app.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app.jar
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false